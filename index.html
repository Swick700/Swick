<!DOCTYPE html>
<html lang="ar" dir="rtl" id="htmlRoot">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Swick Bot - Home</title>
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;800&display=swap" rel="stylesheet">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Cairo', sans-serif;
        }

        body {
            background: #0a0f1d;
            background-image: linear-gradient(135deg, #0a0f1d 0%, #0d1b2a 50%, #1b263b 100%);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            color: #ffffff;
            padding: 20px;
            overflow-x: hidden;
        }

        .lang-container {
            position: absolute;
            top: 20px;
            left: 20px;
            z-index: 10;
        }

        .lang-btn {
            background: rgba(13, 27, 42, 0.9);
            border: 1px solid rgba(255, 255, 255, 0.2);
            color: white;
            padding: 8px 16px;
            border-radius: 8px;
            cursor: pointer;
            font-weight: 600;
        }

        .container {
            position: relative;
            z-index: 2;
            text-align: center;
            background: rgba(13, 27, 42, 0.85);
            backdrop-filter: blur(10px);
            border: 1px solid rgba(255, 255, 255, 0.1);
            padding: 40px 25px;
            border-radius: 24px;
            box-shadow: 0 15px 35px rgba(0, 0, 0, 0.5);
            width: 100%;
            max-width: 420px;
            margin: auto;
        }

        .bot-image {
            width: 110px;
            height: 110px;
            border-radius: 50%;
            object-fit: cover;
            border: 3px solid #0077ff;
            box-shadow: 0 0 20px rgba(0, 119, 255, 0.4);
            margin-bottom: 20px;
        }

        h1 {
            font-size: 24px;
            font-weight: 800;
            color: #ffffff;
            margin-bottom: 10px;
        }

        p {
            font-size: 15px;
            color: #94a3b8;
            margin-bottom: 30px;
            line-height: 1.6;
        }

        .buttons-wrapper {
            display: flex;
            flex-direction: column;
            gap: 15px;
        }

        /* زر إضافة البوت (سمائي غامق) */
        .btn-add {
            display: block;
            background: linear-gradient(135deg, #0284c7 0%, #0369a1 100%);
            color: white;
            padding: 12px 20px;
            font-size: 16px;
            font-weight: 700;
            text-decoration: none;
            border-radius: 50px;
            box-shadow: 0 5px 15px rgba(2, 132, 199, 0.4);
            transition: 0.3s;
        }

        .btn-add:hover {
            transform: translateY(-2px);
        }

        /* الزر المتغير (لوحة التحكم أو تصفح المميزات) */
        .btn-dynamic {
            display: block;
            background: rgba(255, 255, 255, 0.05);
            border: 1px solid rgba(255, 255, 255, 0.15);
            color: #ffffff;
            padding: 12px 20px;
            font-size: 16px;
            font-weight: 700;
            text-decoration: none;
            border-radius: 50px;
            transition: 0.3s;
        }

        .btn-dynamic:hover {
            background: rgba(255, 255, 255, 0.12);
            border-color: #0284c7;
            transform: translateY(-2px);
        }

        /* زر تصفح المميزات الإضافي */
        .btn-features {
            display: block;
            background: rgba(0, 119, 255, 0.1);
            border: 1px solid rgba(0, 119, 255, 0.3);
            color: #60a5fa;
            padding: 10px 20px;
            font-size: 15px;
            font-weight: 600;
            text-decoration: none;
            border-radius: 50px;
            transition: 0.3s;
        }

        .btn-features:hover {
            background: rgba(0, 119, 255, 0.2);
            transform: translateY(-2px);
        }
    </style>
</head>
<body>

    <div class="lang-container">
        <button class="lang-btn" onclick="toggleLanguage()" id="langBtn">English</button>
    </div>

    <div class="container">
        <img src="https://e.top4top.io/p_3959i2gtg0.png" alt="Swick Bot Logo" class="bot-image">
        
        <h1 id="titleText">Welcome To Swick Bot!</h1>
        <p id="descText">أهلاً بك، بوت سويك يرحب بك لإدارة وتطوير سيرفرك بكل احترافية وأمان تام!</p>
        
        <div class="buttons-wrapper">
            <!-- زر إضافة البوت -->
            <a href="https://discord.com/oauth2/authorize?client_id=1566946193454530591&permissions=8&integration_type=0&scope=bot" target="_blank" class="btn-add" id="btnAddText">
                إضافة البوت / Add Bot
            </a>
            
            <!-- الزر المتغير (يتحول تلقائياً لوحة التحكم إذا كان مسجلاً، أو يوجه لصفحة المميزات إذا لم يكن مسجلاً) -->
            <a href="addons.html" class="btn-dynamic" id="dynamicBtn">
                تصفح المميزات / Browse Features
            </a>

            <!-- زر تصفح المميزات الثابت -->
            <a href="addons.html" class="btn-features" id="btnFeatureText">
                استعراض الإضافات / View Addons
            </a>
        </div>
    </div>

    <script>
        let currentLang = 'ar';

        window.addEventListener('DOMContentLoaded', () => {
            const isLogged = localStorage.getItem('swick_logged_in');
            const dynamicBtn = document.getElementById('dynamicBtn');

            if (isLogged === 'true') {
                dynamicBtn.href = '/dashboard';
                dynamicBtn.setAttribute('data-logged', 'true');
                updateButtonText();
            } else {
                dynamicBtn.href = 'addons.html';
                dynamicBtn.removeAttribute('data-logged');
                updateButtonText();
            }
        });

        function updateButtonText() {
            const dynamicBtn = document.getElementById('dynamicBtn');
            const isLogged = dynamicBtn.hasAttribute('data-logged');

            if (currentLang === 'ar') {
                if (isLogged) {
                    dynamicBtn.innerText = 'لوحة التحكم / Dashboard';
                } else {
                    dynamicBtn.innerText = 'تصفح المميزات / Browse Features';
                }
            } else {
                if (isLogged) {
                    dynamicBtn.innerText = 'Dashboard';
                } else {
                    dynamicBtn.innerText = 'Browse Features';
                }
            }
        }

        function toggleLanguage() {
            const htmlRoot = document.getElementById('htmlRoot');
            const langBtn = document.getElementById('langBtn');
            const titleText = document.getElementById('titleText');
            const descText = document.getElementById('descText');
            const btnAddText = document.getElementById('btnAddText');
            const btnFeatureText = document.getElementById('btnFeatureText');

            if (currentLang === 'ar') {
                currentLang = 'en';
                htmlRoot.setAttribute('lang', 'en');
                htmlRoot.setAttribute('dir', 'ltr');
                langBtn.innerText = 'العربية';
                titleText.innerText = 'Welcome To Swick Bot!';
                descText.innerText = 'Welcome! Swick Bot is here to manage and elevate your Discord server with high performance and security.';
                btnAddText.innerText = 'Add Bot';
                btnFeatureText.innerText = 'View Addons';
            } else {
                currentLang = 'ar';
                htmlRoot.setAttribute('lang', 'ar');
                htmlRoot.setAttribute('dir', 'rtl');
                langBtn.innerText = 'English';
                titleText.innerText = 'Welcome To Swick Bot!';
                descText.innerText = 'أهلاً بك، بوت سويك يرحب بك لإدارة وتطوير سيرفرك بكل احترافية وأمان تام!';
                btnAddText.innerText = 'إضافة البوت / Add Bot';
                btnFeatureText.innerText = 'استعراض الإضافات / View Addons';
            }
            updateButtonText();
        }
    </script>

</body>
</html>
