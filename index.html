<!DOCTYPE html>
<html lang="ar" dir="rtl" id="htmlRoot">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Swick Bot - Home</title>
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;800&display=swap" rel="stylesheet">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Cairo', sans-serif;
        }

        body {
            background: linear-gradient(135deg, #0a0f1d 0%, #0d1b2a 50%, #1b263b 100%);
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            overflow: hidden;
            color: #ffffff;
        }

        /* خلفية جمالية متوهجة */
        body::before {
            content: '';
            position: absolute;
            width: 600px;
            height: 600px;
            background: radial-gradient(circle, rgba(0, 119, 255, 0.15) 0%, rgba(0, 0, 0, 0) 70%);
            top: -150px;
            left: -150px;
            z-index: 1;
        }

        /* زر تبديل اللغة أعلى الصفحة */
        .lang-container {
            position: absolute;
            top: 25px;
            left: 30px;
            z-index: 10;
        }

        .lang-btn {
            background: rgba(13, 27, 42, 0.8);
            border: 1px solid rgba(255, 255, 255, 0.15);
            color: white;
            padding: 8px 18px;
            border-radius: 8px;
            cursor: pointer;
            font-weight: 600;
            transition: all 0.3s ease;
            backdrop-filter: blur(5px);
        }

        .lang-btn:hover {
            background: #0077ff;
            border-color: #0077ff;
        }

        .container {
            position: relative;
            z-index: 2;
            text-align: center;
            background: rgba(13, 27, 42, 0.75);
            backdrop-filter: blur(15px);
            border: 1px solid rgba(255, 255, 255, 0.1);
            padding: 50px 40px;
            border-radius: 24px;
            box-shadow: 0 20px 50px rgba(0, 0, 0, 0.6);
            max-width: 480px;
            width: 90%;
            animation: fadeIn 1.2s ease-in-out;
        }

        @keyframes fadeIn {
            from {
                opacity: 0;
                transform: translateY(20px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        .bot-image {
            width: 120px;
            height: 120px;
            border-radius: 50%;
            object-fit: cover;
            border: 3px solid #0077ff;
            box-shadow: 0 0 25px rgba(0, 119, 255, 0.5);
            margin-bottom: 25px;
            animation: pulse 3s infinite;
        }

        @keyframes pulse {
            0% { box-shadow: 0 0 0 0 rgba(0, 119, 255, 0.4); }
            70% { box-shadow: 0 0 0 15px rgba(0, 119, 255, 0); }
            100% { box-shadow: 0 0 0 0 rgba(0, 119, 255, 0); }
        }

        h1 {
            font-size: 28px;
            font-weight: 800;
            color: #ffffff;
            margin-bottom: 12px;
        }

        p {
            font-size: 16px;
            color: #94a3b8;
            margin-bottom: 35px;
            line-height: 1.6;
        }

        .btn-start {
            display: inline-block;
            background: linear-gradient(135deg, #0077ff 0%, #0056b3 100%);
            color: white;
            padding: 14px 40px;
            font-size: 18px;
            font-weight: 700;
            text-decoration: none;
            border-radius: 50px;
            box-shadow: 0 8px 25px rgba(0, 119, 255, 0.4);
            transition: all 0.3s ease;
        }

        .btn-start:hover {
            background: linear-gradient(135deg, #0056b3 0%, #003d82 100%);
            transform: translateY(-3px);
            box-shadow: 0 12px 30px rgba(0, 119, 255, 0.6);
        }

        .btn-start:active {
            transform: translateY(1px);
        }
    </style>
</head>
<body>

    <!-- زر تبديل اللغة -->
    <div class="lang-container">
        <button class="lang-btn" onclick="toggleLanguage()" id="langBtn">English</button>
    </div>

    <div class="container">
        <!-- صورة البوت الخاصة بك -->
        <img src="https://e.top4top.io/p_3959i2gtg0.png" alt="Swick Bot Logo" class="bot-image">
        
        <h1 id="titleText">Welcome To Swick Bot!</h1>
        <p id="descText">أهلاً بك، بوت سويك يرحب بك لإدارة وتطوير سيرفرك بكل احترافية وأمان تام!</p>
        
        <a href="https://discord.com/oauth2/authorize?client_id=1566946193454530591&permissions=8&integration_type=0&scope=bot" target="_blank" class="btn-start" id="btnText">
            Get Started
        </a>
    </div>

    <script>
        let currentLang = 'ar';

        function toggleLanguage() {
            const htmlRoot = document.getElementById('htmlRoot');
            const langBtn = document.getElementById('langBtn');
            const titleText = document.getElementById('titleText');
            const descText = document.getElementById('descText');
            const btnText = document.getElementById('btnText');

            if (currentLang === 'ar') {
                currentLang = 'en';
                htmlRoot.setAttribute('lang', 'en');
                htmlRoot.setAttribute('dir', 'ltr');
                langBtn.innerText = 'العربية';
                titleText.innerText = 'Welcome To Swick Bot!';
                descText.innerText = 'Welcome! Swick Bot is here to manage and elevate your Discord server with high performance and security.';
                btnText.innerText = 'Get Started';
            } else {
                currentLang = 'ar';
                htmlRoot.setAttribute('lang', 'ar');
                htmlRoot.setAttribute('dir', 'rtl');
                langBtn.innerText = 'English';
                titleText.innerText = 'Welcome To Swick Bot!';
                descText.innerText = 'أهلاً بك، بوت سويك يرحب بك لإدارة وتطوير سيرفرك بكل احترافية وأمان تام!';
                btnText.innerText = 'Get Started';
            }
        }
    </script>

</body>
</html>
