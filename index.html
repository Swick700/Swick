<!DOCTYPE html>
<html lang="ar" dir="rtl" id="htmlRoot">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Swick Bot - Home</title>
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;800&display=swap" rel="stylesheet">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Cairo', sans-serif;
        }

        body {
            background: #0a0f1d;
            background-image: linear-gradient(135deg, #0a0f1d 0%, #0d1b2a 50%, #1b263b 100%);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            color: #ffffff;
            padding: 20px;
            overflow-x: hidden;
            position: relative;
        }

        /* حاوية الملف الشخصي أعلى اليمين */
        .user-profile-header {
            position: absolute;
            top: 20px;
            right: 20px;
            display: none;
            align-items: center;
            gap: 12px;
            background: rgba(13, 27, 42, 0.85);
            padding: 6px 15px 6px 6px;
            border-radius: 50px;
            border: 1px solid rgba(255, 255, 255, 0.15);
            backdrop-filter: blur(10px);
            z-index: 10;
        }

        .user-profile-header img {
            width: 38px;
            height: 38px;
            border-radius: 50%;
            border: 2px solid #0284c7;
            object-fit: cover;
        }

        .user-profile-header span {
            font-size: 14px;
            font-weight: 600;
            color: #fff;
        }

        .lang-container {
            position: absolute;
            top: 20px;
            left: 20px;
            z-index: 10;
        }

        .lang-btn {
            background: rgba(13, 27, 42, 0.9);
            border: 1px solid rgba(255, 255, 255, 0.2);
            color: white;
            padding: 8px 16px;
            border-radius: 8px;
            cursor: pointer;
            font-weight: 600;
        }

        .container {
            position: relative;
            z-index: 2;
            text-align: center;
            background: rgba(13, 27, 42, 0.85);
            backdrop-filter: blur(10px);
            border: 1px solid rgba(255, 255, 255, 0.1);
            padding: 40px 25px;
            border-radius: 24px;
            box-shadow: 0 15px 35px rgba(0, 0, 0, 0.5);
            width: 100%;
            max-width: 420px;
            margin: auto;
        }

        .bot-image {
            width: 110px;
            height: 110px;
            border-radius: 50%;
            object-fit: cover;
            border: 3px solid #0077ff;
            box-shadow: 0 0 20px rgba(0, 119, 255, 0.4);
            margin-bottom: 20px;
        }

        h1 {
            font-size: 24px;
            font-weight: 800;
            color: #ffffff;
            margin-bottom: 10px;
        }

        p {
            font-size: 15px;
            color: #94a3b8;
            margin-bottom: 30px;
            line-height: 1.6;
        }

        .buttons-wrapper {
            display: flex;
            flex-direction: column;
            gap: 15px;
        }

        /* زر تسجيل الدخول (بلون سمائي غامق) */
        .btn-login {
            display: block;
            background: linear-gradient(135deg, #0284c7 0%, #0369a1 100%);
            color: white;
            padding: 14px 20px;
            font-size: 16px;
            font-weight: 700;
            text-decoration: none;
            border-radius: 50px;
            box-shadow: 0 5px 15px rgba(2, 132, 199, 0.4);
            transition: 0.3s;
        }

        .btn-login:hover {
            transform: translateY(-2px);
            opacity: 0.95;
        }

        /* زر لوحة التحكم (يظهر للمسجل) */
        .btn-dashboard {
            display: none;
            background: linear-gradient(135deg, #0284c7 0%, #0369a1 100%);
            color: white;
            padding: 14px 20px;
            font-size: 16px;
            font-weight: 700;
            text-decoration: none;
            border-radius: 50px;
            box-shadow: 0 5px 15px rgba(2, 132, 199, 0.4);
            transition: 0.3s;
        }

        .btn-dashboard:hover {
            transform: translateY(-2px);
            opacity: 0.95;
        }
    </style>
</head>
<body>

    <!-- بروفایل المستخدم أعلى اليمين (يظهر عند تسجيل الدخول) -->
    <div class="user-profile-header" id="userHeader">
        <span id="userName">User</span>
        <img id="userAvatar" src="" alt="Avatar">
    </div>

    <div class="lang-container">
        <button class="lang-btn" onclick="toggleLanguage()" id="langBtn">English</button>
    </div>

    <div class="container">
        <img src="https://e.top4top.io/p_3959i2gtg0.png" alt="Swick Bot Logo" class="bot-image">
        
        <h1 id="titleText">Welcome To Swick Bot!</h1>
        <p id="descText">أهلاً بك، بوت سويك يرحب بك لإدارة وتطوير سيرفرك بكل احترافية وأمان تام!</p>
        
        <div class="buttons-wrapper">
            <!-- زر تسجيل الدخول (يختفي إذا كان مسجلاً) -->
            <a href="/auth/discord" class="btn-login" id="btnLogin">
                تسجيل الدخول / Login
            </a>

            <!-- زر لوحة التحكم (يظهر إذا كان مسجلاً بلون سمائي غامق) -->
            <a href="/dashboard" class="btn-dashboard" id="btnDashboard">
                لوحة التحكم / Dashboard
            </a>
        </div>
    </div>

    <script>
        let currentLang = 'ar';

        window.addEventListener('DOMContentLoaded', () => {
            const isLogged = localStorage.getItem('swick_logged_in');
            const username = localStorage.getItem('swick_username');
            const avatar = localStorage.getItem('swick_avatar');

            const btnLogin = document.getElementById('btnLogin');
            const btnDashboard = document.getElementById('btnDashboard');
            const userHeader = document.getElementById('userHeader');

            if (isLogged === 'true') {
                btnLogin.style.display = 'none';
                btnDashboard.style.display = 'block';
                userHeader.style.display = 'flex';
                document.getElementById('userName').innerText = username || 'Discord User';
                document.getElementById('userAvatar').src = avatar || 'https://cdn.discordapp.com/embed/avatars/0.png';
            } else {
                btnLogin.style.display = 'block';
                btnDashboard.style.display = 'none';
                userHeader.style.display = 'none';
            }
        });

        function toggleLanguage() {
            const htmlRoot = document.getElementById('htmlRoot');
            const langBtn = document.getElementById('langBtn');
            const titleText = document.getElementById('titleText');
            const descText = document.getElementById('descText');
            const btnLogin = document.getElementById('btnLogin');
            const btnDashboard = document.getElementById('btnDashboard');

            if (currentLang === 'ar') {
                currentLang = 'en';
                htmlRoot.setAttribute('lang', 'en');
                htmlRoot.setAttribute('dir', 'ltr');
                langBtn.innerText = 'العربية';
                titleText.innerText = 'Welcome To Swick Bot!';
                descText.innerText = 'Welcome! Swick Bot is here to manage and elevate your Discord server with high performance and security.';
                btnLogin.innerText = 'Login';
                btnDashboard.innerText = 'Dashboard';
            } else {
                currentLang = 'ar';
                htmlRoot.setAttribute('lang', 'ar');
                htmlRoot.setAttribute('dir', 'rtl');
                langBtn.innerText = 'English';
                titleText.innerText = 'Welcome To Swick Bot!';
                descText.innerText = 'أهلاً بك، بوت سويك يرحب بك لإدارة وتطوير سيرفرك بكل احترافية وأمان تام!';
                btnLogin.innerText = 'تسجيل الدخول / Login';
                btnDashboard.innerText = 'لوحة التحكم / Dashboard';
            }
        }
    </script>

</body>
</html>
